<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atelier – Your Time Curator</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0F172A',
            primaryDark: '#020617',
            accent: '#C9A96E',
            accentHover: '#D4B978',
            secondary: '#1E293B',
            light: '#FAFAFA',
            muted: '#94A3B8',
            bubbleUser: '#C9A96E',
            bubbleAI: '#2D3748',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif'],
          },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"/>
</head>
<body class="bg-primary text-light min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-primary/95 backdrop-blur-md border-b border-accent/10">
    <div class="max-w-4xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16 sm:h-20">
        <div class="flex items-center gap-2.5">
          <div class="text-2xl sm:text-3xl font-serif font-bold tracking-tight text-accent">
            Atelier
          </div>
          <span class="hidden xs:inline text-xs sm:text-sm text-muted font-light tracking-wider uppercase">
            Time Curator
          </span>
        </div>
        <button class="text-muted hover:text-accent transition text-sm sm:text-base font-light">
          ← Dashboard
        </button>
      </div>
    </div>
  </header>

  <!-- Chat messages area -->
  <main class="flex-1 pt-16 sm:pt-20 pb-28 sm:pb-32 overflow-hidden flex flex-col">
    <div id="chat-container" class="flex-1 overflow-y-auto px-4 sm:px-6 pt-5 pb-6 max-w-4xl mx-auto w-full space-y-5 sm:space-y-6">

      <!-- Welcome message -->
      <div class="flex items-start gap-3 sm:gap-4 message-ai animate-fade-in">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-accent/20 flex-shrink-0 flex items-center justify-center text-xl sm:text-2xl">
          🕰️
        </div>
        <div class="bg-secondary/60 backdrop-blur-sm rounded-2xl rounded-tl-none px-4 py-3 sm:px-5 sm:py-4 max-w-[85%] sm:max-w-[72%]">
          <p class="text-muted text-xs sm:text-sm mb-1">Atelier • just now</p>
          <p class="text-sm sm:text-base">Good evening, Hehe. How may I refine your time today?</p>
          <p class="mt-2 text-muted text-xs sm:text-sm italic font-light">
            You have 3 events tomorrow and 2 hours blocked for deep work.
          </p>
        </div>
      </div>

    </div>
  </main>

  <!-- Input area – fixed bottom -->
  <footer class="fixed bottom-0 left-0 right-0 bg-primary/95 backdrop-blur-lg border-t border-accent/10 py-3 px-4 sm:px-6">
    <div class="max-w-4xl mx-auto">
      <form id="chat-form" class="flex items-end gap-2 sm:gap-3">
        <textarea
          id="message-input"
          rows="1"
          placeholder="Ask me anything about your schedule..."
          class="flex-1 min-h-[52px] resize-none bg-secondary/40 backdrop-blur-md border border-accent/20 rounded-2xl px-4 py-3 sm:px-5 sm:py-4 text-sm sm:text-base text-light placeholder-muted focus:border-accent focus:ring-1 focus:ring-accent outline-none max-h-40 overflow-y-auto leading-relaxed"
        ></textarea>

        <button
          type="submit"
          class="bg-accent text-primary p-3.5 sm:p-4 rounded-full hover:bg-accentHover transition shadow-lg hover:shadow-xl flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 flex-shrink-0"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </button>
      </form>

      <p class="text-center text-xs text-muted mt-2.5 sm:mt-3 opacity-80">
        Atelier may suggest calendar changes • Always confirm
      </p>
    </div>
  </footer>

  <script>
    const textarea = document.getElementById('message-input');
    const form = document.getElementById('chat-form');
    const chatContainer = document.getElementById('chat-container');

    // Auto-resize textarea (mobile-friendly)
    function adjustHeight() {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
    }

    textarea.addEventListener('input', adjustHeight);
    window.addEventListener('resize', adjustHeight);

    // Send message simulation
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const message = textarea.value.trim();
      if (!message) return;

      // User message bubble
      const userMsg = document.createElement('div');
      userMsg.className = 'flex items-start justify-end gap-3 sm:gap-4 animate-fade-in';
      userMsg.innerHTML = `
        <div class="bg-accent/90 text-primary rounded-2xl rounded-tr-none px-4 py-3 sm:px-5 sm:py-4 max-w-[85%] sm:max-w-[72%]">
          <p class="text-sm sm:text-base">${message.replace(/\n/g, '<br>')}</p>
        </div>
      `;
      chatContainer.appendChild(userMsg);

      textarea.value = '';
      adjustHeight();

      chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

      // Fake typing + response
      setTimeout(() => {
        const typing = document.createElement('div');
        typing.id = 'typing';
        typing.className = 'flex items-start gap-3 sm:gap-4 message-ai';
        typing.innerHTML = `
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-accent/20 flex-shrink-0 flex items-center justify-center text-xl sm:text-2xl">
            🕰️
          </div>
          <div class="bg-secondary/60 backdrop-blur-sm rounded-2xl rounded-tl-none px-4 py-3 sm:px-5 sm:py-4 max-w-[85%] sm:max-w-[72%]">
            <div class="flex gap-1.5">
              <div class="w-2 h-2 bg-muted rounded-full animate-bounce [animation-delay:0s]"></div>
              <div class="w-2 h-2 bg-muted rounded-full animate-bounce [animation-delay:0.2s]"></div>
              <div class="w-2 h-2 bg-muted rounded-full animate-bounce [animation-delay:0.4s]"></div>
            </div>
          </div>
        `;
        chatContainer.appendChild(typing);
        chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

        setTimeout(() => {
          typing.remove();

          const aiMsg = document.createElement('div');
          aiMsg.className = 'flex items-start gap-3 sm:gap-4 animate-fade-in message-ai';
          aiMsg.innerHTML = `
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-accent/20 flex-shrink-0 flex items-center justify-center text-xl sm:text-2xl">
              🕰️
            </div>
            <div class="bg-secondary/60 backdrop-blur-sm rounded-2xl rounded-tl-none px-4 py-3 sm:px-5 sm:py-4 max-w-[85%] sm:max-w-[72%]">
              <p class="text-muted text-xs sm:text-sm mb-1">Atelier • just now</p>
              <p class="text-sm sm:text-base">Got it. I've drafted a balanced 4-week plan with focused blocks, reviews, and buffers. Would you like to see the proposal?</p>
              <p class="mt-2 text-accent text-sm font-medium cursor-pointer hover:underline">View suggested schedule →</p>
            </div>
          `;
          chatContainer.appendChild(aiMsg);
          chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }, 1400 + Math.random() * 1000);
      }, 300);
    });

    // Enter to send (Shift+Enter = new line)
    textarea.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit'));
      }
    });

    // Initial scroll
    window.addEventListener('load', () => {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    .animate-fade-in {
      animation: fadeIn 0.45s ease-out forwards;
    }
    .animate-bounce {
      animation: bounce 1.1s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }
  </style>

</body>
</html>
